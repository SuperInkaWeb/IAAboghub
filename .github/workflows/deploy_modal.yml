name: Deploy Backend to Modal Cloud GPU

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy_modal.yml"
  workflow_dispatch:

jobs:
  deploy-modal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal CLI and python-dotenv
        run: pip install modal python-dotenv

      - name: Generate .env from GitHub Secrets
        env:
          ENV_FILE_SECRET: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE_SECRET" ]; then
            printf "%s\n" "$ENV_FILE_SECRET" | tr -d '\r' > .env
            echo "Archivo .env generado correctamente con $(wc -l < .env) lineas."
          else
            echo "ADVERTENCIA: El secreto ENV_FILE esta vacio."
          fi

      - name: Authenticate and Deploy FastAPI + Ollama GPU to Modal
        env:
          RAW_MODAL_ID: ${{ secrets.MODAL_TOKEN_ID }}
          RAW_MODAL_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          CLEAN_ID=$(printf "%s" "$RAW_MODAL_ID" | tr -d '[:space:]')
          CLEAN_SECRET=$(printf "%s" "$RAW_MODAL_SECRET" | tr -d '[:space:]')
          python -m modal token set --token-id "$CLEAN_ID" --token-secret "$CLEAN_SECRET"
          python -m modal deploy modal_deploy.py
